name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'
      - name: Verify MobileFFmpeg artifact on Maven Central
        run: |
          set -eux
          curl -fIL --retry 3 --retry-delay 2 https://repo.maven.apache.org/maven2/com/arthenica/mobile-ffmpeg-full-gpl/4.4/mobile-ffmpeg-full-gpl-4.4.pom
          curl -fIL --retry 3 --retry-delay 2 https://repo.maven.apache.org/maven2/com/arthenica/mobile-ffmpeg-full-gpl/4.4/mobile-ffmpeg-full-gpl-4.4.aar
      - name: Build debug APK
        run: gradle --no-daemon --info assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bardi-live-streamer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
