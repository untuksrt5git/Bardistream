name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and legacy NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-28 build-tools;28.0.3 ndk;18.1.5063045'

      - name: Pin Android SDK and legacy NDK for AGP 3.5.4
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/18.1.5063045"
          test -d "$NDK"
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$SDK" "$NDK" > local.properties
          cat local.properties
          test -x "$NDK/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin/arm-linux-androideabi-strip"

      - name: Set up JDK 8 for legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build APK with Gradle 5.6.4
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '5.6.4'
          arguments: assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bardi-live-streamer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
